# Dnevna ponovna izgradnja weba – ponude restorana (i ostali sadržaj s datumima)
# tako se same uključuju i isključuju prema razdoblju valjanosti.
# Postavljanje: na hostingu (Cloudflare Pages / Netlify) napravite "Deploy hook" i
# spremite njegov URL u GitHub → Settings → Secrets → Actions kao DEPLOY_HOOK_URL.
name: Dnevna izgradnja weba

on:
  schedule:
    - cron: '15 2 * * *' # svaki dan oko 03:15 / 04:15 po hrvatskom vremenu
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pokreni build na hostingu
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL nije postavljen – preskačem."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
